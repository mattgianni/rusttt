[package]
name = "rusttt"
version = "0.1.4"
authors = ["Matthew Gianni"]
readme = "README.md"
edition = "2024"
repository = "https://github.com/mattgianni/rusttt"
license = "MIT"
categories = ["games"]
description = "A tic-tac-toe game."

[dependencies]
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = "0.29.0"
env_logger = "0.11.8"
log = "0.4.29"
rand = "0.9.2"
ratatui = "0.30.0"
rayon = "1.11.0"
